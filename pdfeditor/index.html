<!DOCTYPE html>
<html lang="en">
<head>
    <title>PDF Editor</title>
    <meta charset="utf-8" />
    <meta name="author" content="SidPro"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta name="description" content="Online PDF Editor which can merge PDFs,compress PDF,split PDF and extract text from PDF."/>
    <meta name="keywords" content="mergePdfs,split,split pdf,extract text"/>
    <!-- icons -->
    <link rel="apple-touch-icon" sizes="57x57" href="../icons/favicon-57x57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="../icons/favicon-60x60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="../icons/favicon-72x72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="../icons/favicon-76x76.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="../cons/favicon-114x114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="../icons/favicon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="../icons/favicon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/favicon-180x180.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="../icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/favicon-192x192.png" />
    <link rel="shortcut icon" type="image/x-icon" href="../icons/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="../icons/favicon.ico" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-config" content="../icons/browserconfig.xml" />
    <link rel="manifest" href="../icons/manifest.json" />
    <!-- icons -->
    <link href="style.css" rel="stylesheet" type="text/css" charset="utf-8" />
    <script src="https://kit.fontawesome.com/5e8f32d58e.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="overlay">
        <div class="loading-spinner" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
    </div>

    <div class="sidebar">
        <h2><button class="hamburger" id="hamburger-icon">
            <i class="fas fa-bars"></i> 
        </button>PDF Editor</h2>
        <ul class="sidebarOptions">
            <li id="merge-option" onclick="changeOption('merge')">
                <i class="fas fa-compress"></i> Merge PDFs
            </li>
            <li id="split-option" onclick="changeOption('split')">
                <i class="fas fa-columns"></i> Split PDFs
            </li>
            <li id="extract-option" onclick="changeOption('extract')">
                <i class="fas fa-file-alt"></i> Extract Text
            </li>
        </ul>
    </div>
    <br/>
    <div class="container">
        <noscript>
            <i style="color:orange;font-size:24px;">Your browser does not support JavaScript!</i><br/>
            <img src="../image/noscript.png" style="width:auto;height:auto;" />
         </noscript>
        <h1 id="page-title">PDF Merger</h1>
        
        <div id="drop-zone">
            Drop PDF files here or
            <button onclick="document.getElementById('file-input').click()">Select Files</button>
            <input type="file" id="file-input" accept=".pdf" multiple style="display: none">
        </div>

        <div class="file-list" id="file-list">
            <p>No files selected</p>
        </div>

        <div class="page-range-inputs control-split">
            <label for="page-ranges">Enter Page Ranges (e.g., 1-5, 7-8, 15):</label>
            <input type="text" id="page-ranges" placeholder="1-5, 7-8, 15" />
        </div>

        <div class="page-selector control-extract" id="page-selector" style="display: none;">
            <label for="page-number">Page: </label>
            <select id="page-number"></select>
            <button id="extract-button">Extract Text</button>
        </div>

        <div class="search-box control-extract" id="search-box" style="display: none;">
            <input type="text" id="search-input" placeholder="Search in text...">
            <button id="search-button">Search</button>
        </div>

        <div>
            <span class="control-merge"><button id="merge-button" disabled>Merge PDFs</button></span>
            <span class="control-split"><button id="split-button" disabled>Split PDF</button></span>
            <button id="clear-button" disabled>Clear All</button>
        </div>

        <div class="loading" id="loading">
            <p>Processing... Please wait.</p>
        </div>

        <div id="output" class="control-split"></div>

        <div id="text-container" class="control-extract">
            <button id="copy-button">Copy Text</button>
            <div class="text-output" id="text-output"></div>
        </div>
        <p style="margin-top: 50px;margin-bottom: 20px;text-align: center;">
            © Copyright 2020-<script>document.write(new Date().getFullYear())</script> by <a href="https://collegeek.com/" ><b><span style="font-size:20px;">C</span>ollegeek</b></a>. All Rights Reserved.
         </p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="pdfeditor.js" type="text/javascript"></script>
</body>
</html>
